<div class="login">
  @if (checking()) {
    <div class="login__card">
      <h1>Domora</h1>
      <p class="login__subtitle">Comprobando el enlace…</p>
    </div>
  } @else if (tokenError()) {
    <div class="login__card">
      <h1>Domora</h1>
      <p class="login__error">{{ tokenError() }}</p>
      <a routerLink="/forgot-password" class="login__demo-btn">Pedir un enlace nuevo</a>
    </div>
  } @else {
    <form class="login__card" (ngSubmit)="submit()">
      <h1>Domora</h1>
      <p class="login__subtitle">Elige tu nueva contraseña</p>

      <label for="reset-password">Contraseña nueva</label>
      <input class="field--bare"
        id="reset-password"
        type="password"
        name="password"
        autocomplete="new-password"
        [(ngModel)]="password"
        required
      />

      <label for="reset-password-confirm">Repite la contraseña</label>
      <input class="field--bare"
        id="reset-password-confirm"
        type="password"
        name="confirmPassword"
        autocomplete="new-password"
        [(ngModel)]="confirmPassword"
        required
      />

      @if (submitError()) {
        <p class="login__error">{{ submitError() }}</p>
      }

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Guardando…' : 'Restablecer contraseña' }}
      </button>
    </form>
  }
</div>
