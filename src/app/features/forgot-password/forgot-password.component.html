<div class="login">
  <form class="login__card" (ngSubmit)="submit()">
    <h1>Domora</h1>
    <p class="login__subtitle">Recuperar contraseña</p>

    @if (submitted()) {
      <p class="login__message">{{ message() }}</p>
      <a routerLink="/login" class="login__demo-btn">Volver al inicio de sesión</a>
    } @else {
      <p class="login__subtitle login__subtitle--hint">Introduce tu email y te enviamos un enlace para elegir una contraseña nueva.</p>

      <label for="forgot-email">Email</label>
      <input class="field--bare"
        id="forgot-email"
        type="email"
        name="email"
        placeholder="tu@email.com"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando…' : 'Enviar enlace' }}
      </button>

      <a routerLink="/login" class="login__register-link">Volver al inicio de sesión</a>
    }
  </form>
</div>
