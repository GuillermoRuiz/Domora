<div class="modal-backdrop" (click)="close()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="comments-title" (click)="$event.stopPropagation()" (keydown.escape)="close()">
    <div class="modal__header">
      <h4 id="comments-title"><app-icon name="file-text" [size]="16"></app-icon> {{ heading }}</h4>
      <button type="button" class="close-btn" aria-label="Cerrar" (click)="close()"><app-icon name="x" [size]="16"></app-icon></button>
    </div>

    <div class="modal__body">
      <p class="hint">
        <strong>{{ row.number ? row.number + ' · ' : '' }}{{ row.title }}</strong><br />
        {{ description }}
      </p>

      <label class="field">
        <span class="sr-only">Comentarios</span>
        <textarea
          rows="8"
          [attr.maxlength]="max"
          [placeholder]="placeholder"
          [ngModel]="text()"
          (ngModelChange)="text.set($event)"
          [disabled]="busy"
        ></textarea>
        <span class="counter">{{ text().length }} / {{ max }}</span>
      </label>

      @if (error) {
        <p class="field-error" role="alert">{{ error }}</p>
      }
    </div>

    <div class="modal__footer">
      <app-btn variant="outline" size="sm" [disabled]="busy" (clicked)="close()">Cancelar</app-btn>
      <app-btn variant="primary" size="sm" [disabled]="busy || unchanged" (clicked)="submit()">
        {{ busy ? 'Guardando…' : 'Guardar comentarios' }}
      </app-btn>
    </div>
  </div>
</div>
