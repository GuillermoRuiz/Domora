<app-section-card title="Documentos recientes" [actionLabel]="rows().length > 0 ? 'Ver todos' : ''" [padded]="false" (action)="viewAll.emit()">
  @if (documents() === null && !failed()) {
    <p class="doc__message">Cargando…</p>
  } @else if (failed()) {
    <p class="doc__message doc__message--error" role="alert">No se pudieron cargar los documentos.</p>
  } @else if (rows().length === 0) {
    <p class="doc__message" data-empty>La comunidad todavía no ha publicado documentos.</p>
  } @else {
    <ul class="doc" data-list="documents">
      @for (row of rows(); track row.doc.id) {
        <li class="doc__item" [attr.data-document]="row.doc.id">
          <button type="button" class="doc__open" data-action="open" [attr.aria-label]="'Ver ' + row.doc.title" (click)="open.emit(row.doc)">
            <span class="doc__icon"><app-icon name="file" [size]="16"></app-icon></span>
            <span class="doc__text">
              <span class="doc__title">{{ row.doc.title }}</span>
              <span class="doc__sub">{{ row.detail }}</span>
            </span>
          </button>
          <button type="button" class="doc__download" data-action="download" [attr.aria-label]="'Descargar ' + row.doc.title" (click)="download.emit(row.doc)">
            <app-icon name="download" [size]="16"></app-icon>
          </button>
        </li>
      }
    </ul>
  }
</app-section-card>
