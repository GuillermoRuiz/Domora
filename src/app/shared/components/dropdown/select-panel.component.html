@for (item of items(); track $index; let i = $index) {
  @if (item.group) {
    <div class="dd__group" role="presentation">{{ item.label }}</div>
  } @else {
    <div
      class="dd__option"
      role="option"
      [id]="optionId(i)"
      [class.dd__option--selected]="item.selected"
      [class.dd__option--active]="i === activeIndex()"
      [class.dd__option--disabled]="item.disabled"
      [attr.aria-selected]="item.selected"
      [attr.aria-disabled]="item.disabled || null"
      (click)="choose(item)"
      (mouseenter)="hover(i, item)"
    >
      <span class="dd__option-text">{{ item.label }}</span>
      @if (item.selected) {
        <app-icon class="dd__check" name="check" [size]="14"></app-icon>
      }
    </div>
  }
}
