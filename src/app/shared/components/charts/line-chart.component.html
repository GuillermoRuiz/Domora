<figure class="chart">
  @if (!hasData()) {
    <p class="chart__empty">{{ emptyText() }}</p>
  } @else {
    @if (showTable()) {
      <div class="chart__table-wrap">
        <table class="chart__table">
          <caption>{{ caption() }}</caption>
          <thead>
            <tr><th scope="col"></th><th scope="col">{{ label() }}</th></tr>
          </thead>
          <tbody>
            @for (row of tableRows(); track row.label) {
              <tr><th scope="row">{{ row.label }}</th><td>{{ row.value }}</td></tr>
            }
          </tbody>
        </table>
      </div>
    } @else {
      <div class="chart__plot" (pointerleave)="hover.set(null)">
        <svg class="chart__svg" [attr.width]="width()" [attr.height]="height()" role="group" [attr.aria-label]="caption()">
          @for (tick of ticks(); track tick.value) {
            <line class="chart__grid" [attr.x1]="plotLeft" [attr.x2]="width() - 8" [attr.y1]="tick.y" [attr.y2]="tick.y" />
            <text class="chart__tick" [attr.x]="plotLeft - 8" [attr.y]="tick.y + 4" text-anchor="end">{{ tick.label }}</text>
          }
          @if (fill()) {
            <path class="chart__area" [attr.d]="fill()" [style.fill]="color()" />
          }
          @if (tooltip(); as tip) {
            <line class="chart__crosshair" [attr.x1]="tip.point.x" [attr.x2]="tip.point.x" y1="10" [attr.y2]="bottom()" />
          }
          <path class="chart__line" [attr.d]="line()" [style.stroke]="color()" />
          @if (tooltip(); as tip) {
            <circle class="chart__marker" [attr.cx]="tip.point.x" [attr.cy]="tip.point.y" r="4" [style.fill]="color()" />
          }
          @for (point of points(); track point.index) {
            @if (point.showLabel) {
              <text class="chart__xlabel" [attr.x]="point.x" [attr.y]="height() - 10" text-anchor="middle">{{ point.label }}</text>
            }
            <rect
              class="chart__hit"
              role="img"
              tabindex="0"
              [attr.aria-label]="point.aria"
              [attr.x]="point.slotX"
              y="0"
              [attr.width]="point.slotWidth"
              [attr.height]="height()"
              (pointermove)="hover.set(point.index)"
              (focus)="hover.set(point.index)"
              (blur)="hover.set(null)"
            />
          }
        </svg>
        @if (tooltip(); as tip) {
          <div class="chart__tooltip" role="presentation" [style.left.px]="tip.left">
            <div class="chart__tooltip-title">{{ tip.point.label }}</div>
            <div class="chart__tooltip-row">
              <span class="chart__key" [style.background]="color()" aria-hidden="true"></span>
              <strong class="chart__tooltip-value">{{ tip.value }}</strong>
              <span class="chart__tooltip-label">{{ label() }}</span>
            </div>
          </div>
        }
      </div>
    }

    <button type="button" class="chart__toggle" (click)="showTable.set(!showTable())">
      {{ showTable() ? 'Ver gráfico' : 'Ver como tabla' }}
    </button>
  }
</figure>
