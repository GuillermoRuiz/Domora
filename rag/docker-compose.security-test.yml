# Disposable fixture database only; no application volume or DB reused.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_security_test
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: disposable-test-password
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag_test -d rag_security_test']
      interval: 2s
      timeout: 2s
      retries: 15
