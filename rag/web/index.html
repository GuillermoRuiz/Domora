<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domora Asistente</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1c2430;
    --muted: #6b7686;
    --line: #e2e6ec;
    --accent: #2f5bea;
    --accent-soft: #e9eefe;
    --user: #2f5bea;
    --user-text: #ffffff;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --panel: #1b212a;
      --text: #e7ebf1;
      --muted: #94a0b1;
      --line: #2a323d;
      --accent: #6d8dff;
      --accent-soft: #232c47;
      --user: #3b62e0;
      --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header h1 small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  header label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header input {
    width: 130px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
  }
  button:hover { background: var(--bg); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 420px;
  }
  .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .suggestions button { text-align: left; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant p { margin: 0 0 8px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.error { align-self: center; color: var(--danger); background: transparent; border: 1px solid var(--danger); }
  .cite {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 0 5px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    vertical-align: 1px;
  }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: b 1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  form {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 160px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    line-height: 1.4;
  }
  textarea:focus, header input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 600;
  }
  #send:hover { filter: brightness(1.08); background: var(--accent); }
  #send:disabled { opacity: .5; cursor: default; }
  .note { font-size: 11px; color: var(--muted); text-align: center; padding: 0 16px 10px; }
  @media (max-width: 560px) {
    header label { display: none; }
    .msg { max-width: 94%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Domora Asistente <small>Consulta sobre comunidades de propietarios</small></h1>
    <label>Comunidad <input id="community" placeholder="global" autocomplete="off"></label>
    <button id="reset" type="button">Nueva conversación</button>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe tu pregunta…" aria-label="Pregunta"></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
  <div class="note">Orientación general basada en los documentos cargados; no sustituye el asesoramiento de un abogado.</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages"), inputEl = $("input"), sendEl = $("send"), communityEl = $("community");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

// Identidad de PRUEBA: en producción user_id y community_id los pone tu backend autenticado.
let userId = store.get("domora_user");
if (!userId) { userId = "web-" + Math.random().toString(36).slice(2, 10); store.set("domora_user", userId); }
let conversationId = store.get("domora_conv");
communityEl.value = store.get("domora_community") || "";

const SUGGESTIONS = [
  "¿Se puede tapiar la puerta de mi casa si da a una zona común?",
  "¿Necesito unanimidad para instalar un ascensor?",
  "¿Puede la comunidad prohibir el alquiler turístico?",
];

function esc(t) {
  return t.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderMarkdown(text) {
  return esc(text)
    .split(/\n{1,}/)
    .filter((l) => l.trim())
    .map((l) => "<p>" + l
      .replace(/(?:\s*\[S\d+\])+/g, "")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>") + "</p>")
    .join("");
}

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMessage(role, text) {
  clearEmpty();
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "assistant") el.innerHTML = renderMarkdown(text);
  else el.textContent = text;
  messagesEl.appendChild(el);
  scrollDown();
  return el;
}

function clearEmpty() { const e = messagesEl.querySelector(".empty"); if (e) e.remove(); }

function showEmpty() {
  messagesEl.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  box.innerHTML = "<h2>¿En qué te puedo ayudar?</h2><div>Pregunta sobre la Ley de Propiedad Horizontal, el Código Civil o tu comunidad.</div>";
  const list = document.createElement("div");
  list.className = "suggestions";
  SUGGESTIONS.forEach((q) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q;
    b.onclick = () => { inputEl.value = q; send(); };
    list.appendChild(b);
  });
  box.appendChild(list);
  messagesEl.appendChild(box);
}

function community() { return communityEl.value.trim() || null; }

async function restore() {
  if (!conversationId) return showEmpty();
  try {
    const qs = new URLSearchParams({ user_id: userId });
    if (community()) qs.set("community_id", community());
    const res = await fetch(`/conversations/${conversationId}/messages?` + qs);
    if (!res.ok) throw new Error();
    const { messages } = await res.json();
    if (!messages.length) return showEmpty();
    messagesEl.innerHTML = "";
    messages.forEach((m) => addMessage(m.role, m.content));
  } catch {
    conversationId = null; store.set("domora_conv", null); showEmpty();
  }
}

let busy = false;
async function send() {
  const question = inputEl.value.trim();
  if (!question || busy) return;
  busy = true; sendEl.disabled = true;
  inputEl.value = ""; autosize();
  addMessage("user", question);
  const typing = addMessage("assistant", "");
  typing.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question,
        community_id: community(),
        user_id: userId,
        conversation_id: conversationId,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error " + res.status);
    conversationId = data.conversation_id;
    store.set("domora_conv", conversationId);
    typing.innerHTML = renderMarkdown(data.answer);
  } catch (err) {
    typing.remove();
    addMessage("error", "No se pudo obtener respuesta: " + err.message);
  } finally {
    busy = false; sendEl.disabled = false; inputEl.focus(); scrollDown();
  }
}

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("reset").addEventListener("click", () => {
  conversationId = null; store.set("domora_conv", null); showEmpty(); inputEl.focus();
});
communityEl.addEventListener("change", () => {
  store.set("domora_community", communityEl.value.trim());
  conversationId = null; store.set("domora_conv", null); showEmpty();
});

restore();
inputEl.focus();
</script>
</body>
</html>
