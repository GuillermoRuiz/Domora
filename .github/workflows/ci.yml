name: CI

# Sin esto, el typecheck, los tests y `npm audit` dependen de que alguien se
# acuerde de ejecutarlos a mano. La auditoría de seguridad encontró 5
# vulnerabilidades altas en dependencias (multer vía @nestjs/platform-express)
# que llevaban tiempo ahí sin que nadie mirase — ver
# doc/auditoria-seguridad-rendimiento.md §A7.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  rag-security:
    name: RAG security / real pgvector
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_security_test
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_security_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DOMORA_ENVIRONMENT: test
      DOMORA_TEST_DATABASE_URL: postgresql://rag_test:disposable-test-password@localhost:55432/rag_security_test
      DOMORA_RAG_ALLOW_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r rag/requirements.txt
      - run: python -m unittest discover -s rag -p 'test_*.py' -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Más de 20 specs son de integración contra Postgres real: prueban lo que
    # un mock no puede demostrar (concurrencia, triggers, CHECK, agregados
    # SQL). Sin base de datos fallaban con "Can't reach database server".
    # Mismo esquema que azure-pipelines.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domora
          POSTGRES_PASSWORD: domora
          POSTGRES_DB: domora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://domora:domora@localhost:5432/domora?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # El cliente de Prisma se genera a partir del schema y no está
      # versionado: sin esto no compilan ni los tipos ni los tests.
      - name: Generar cliente de Prisma
        working-directory: backend
        run: npx prisma generate

      # El tsconfig.json del backend es el que comprueba de verdad; ver la
      # nota del frontend más abajo.
      - name: Typecheck
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit

      # Las migraciones crean también los CHECK y triggers en SQL crudo que
      # comprueban las specs de integración.
      - name: Migraciones
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Tests
        working-directory: backend
        run: npm test

      - name: Lint
        working-directory: backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # OJO: tiene que ser tsconfig.app.json. El tsconfig.json de la raíz
      # incluye solo los ficheros de referencias de proyecto, así que
      # reporta 0 errores SIEMPRE — daría un verde falso.
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build de producción
        run: npm run build

  # Job propio para que un aviso de seguridad en dependencias no se confunda
  # con un fallo de compilación al mirar la lista de checks.
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: npm audit (frontend)
        run: npm audit --audit-level=high
