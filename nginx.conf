# Servidor del frontend Domora (SPA Angular) + proxy a la API.
#
# El build de producción usa apiBaseUrl relativo '/api/v1'
# (src/environments/environment.ts), así que este nginx cumple dos
# funciones: servir los estáticos con fallback a index.html (rutas del
# router de Angular) y reenviar /api/v1 al backend. El upstream se
# resuelve por variable de entorno API_UPSTREAM (ver Dockerfile.frontend),
# que en Azure Container Apps es el FQDN interno de domora-api y en
# compose el nombre del servicio.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (espejo de las del backend para los estáticos)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Content-Security-Policy: se emite AQUÍ y no en el backend porque este
    # nginx es quien sirve el HTML — una CSP en una API que solo devuelve
    # JSON no protege nada. Es la defensa que hace tolerable guardar el
    # refresh token en localStorage (ver doc/auditoria-seguridad-rendimiento.md).
    #
    # 'unsafe-inline' en style-src es requisito de Angular, que inyecta los
    # estilos de cada componente como <style>. En script-src NO hace falta:
    # el build de producción no emite scripts en línea, así que se queda en
    # 'self', que es lo que de verdad frena un XSS.
    # Los dominios de Google Fonts salen de src/index.html. tile.openstreetmap.org
    # sirve las teselas del mapa de «Datos generales» (environment.mapTiles):
    # si se cambia de proveedor de teselas, cambiar también este img-src.
    # frame-src blob: permite la vista previa de PDFs de la biblioteca de
    # documentos (iframe con URL blob: creada en el navegador).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ovc.catastro.meh.es https://tile.openstreetmap.org; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Estáticos con hash en el nombre → cache larga
    #
    # OJO: en nginx, `add_header` dentro de un bloque DESCARTA todos los
    # heredados del bloque padre, no los suma. Sin repetirlos aquí, el JS y
    # el CSS de la aplicación se servían sin ninguna cabecera de seguridad
    # (en particular sin `nosniff`, que en estáticos es justo donde importa).
    location ~* \.(js|css|woff2?|svg|png|jpg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # API → backend (mismo origen para el navegador; sin CORS en producción)
    location /api/v1/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # Sin Host override: el ingress interno de Container Apps rutea por Host header,
        # y forwardear el Host del navegador rebota la request con un 404 propio de Azure.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m; # uploads de la Fase 12 (límite app: 10 MB)
    }

    # SPA fallback: cualquier ruta no estática la resuelve Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
